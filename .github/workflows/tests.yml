name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # monthly, to catch library drift
    # min hour day-of-month month day-of-week
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Colab's Python version
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Only the solutions: the student versions stop at their exercise blanks.
      - name: Run tests
        run: |
          pytest --nbmake soln/*.ipynb
